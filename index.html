<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-build="a9d3aad1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 应用开发 7 天 · 沙盒实训</title>
<meta name="description" content="7 天从零跑通 AI 应用开发：21 个自动判分关卡 + 7 个闭卷挑战 + 56 道自测题 + 180 条命令词典，逐字拆解每条命令。全程浏览器沙盒，不用装任何东西。">
<link rel="stylesheet" href="css/theme.css?v=29107e0e">
<link rel="stylesheet" href="css/app.css?v=607d71c9">
</head>
<body>

<header class="topbar">
  <button id="btnMenu" class="icon-btn only-narrow" title="天列表" aria-label="天列表"
          data-i18n-title="top.menu" data-i18n-aria="top.menu">☰</button>

  <a class="brand" href="#/d1">
    <span class="brand-mark">AI</span>
    <span class="brand-text" data-i18n-html="brand.text">应用开发 <b>7 天</b></span>
  </a>

  <div class="topbar-mid">
    <div class="ring" id="ring"><span id="ringText">0%</span></div>
    <div class="topbar-stat">
      <span id="topStat">0 / 0 关</span>
      <span id="topDay" class="muted"></span>
    </div>
  </div>

  <div class="topbar-actions">
    <button id="btnReport" class="ghost-btn" data-i18n="top.report">结业报告</button>
    <button id="btnLang" class="icon-btn lang-btn" title="切换到英文界面 · Switch to English"
            aria-label="切换到英文界面 · Switch to English" data-lang="zh">EN</button>
    <button id="btnTheme" class="icon-btn" title="切换主题" aria-label="切换主题"
            data-i18n-title="top.theme" data-i18n-aria="top.theme">◐</button>
  </div>
</header>

<div class="shell">
  <aside class="sidenav" id="sidenav">
    <div class="sidenav-head" data-i18n="nav.title">7 天路线</div>
    <nav id="dayList" class="day-list"></nav>
    <div id="sideExtra" class="side-extra"></div>
    <div class="sidenav-foot">
      <button id="btnResetAll" class="link-btn" data-i18n="nav.resetAll">清空全部进度</button>
      <p class="sidenav-note" data-i18n="nav.resetNote">进度存在本机浏览器里，不上传。</p>
    </div>
  </aside>

  <main class="content" id="content" tabindex="-1"></main>
</div>

<!-- ============================ 沙盒终端 ============================ -->
<button id="termFab" class="fab" title="沙盒终端（快捷键 ~）" aria-label="沙盒终端"
        data-i18n-title="term.fab" data-i18n-aria="term.panel">⌨</button>

<section id="termPanel" class="term-panel" aria-label="沙盒终端" data-i18n-aria="term.panel">
  <div id="termGripCorner" class="term-grip-corner" title="拖动改变宽高" aria-hidden="true"
       data-i18n-title="term.gripCorner"></div>
  <div id="termGrip" class="term-grip" title="拖动改变高度" aria-hidden="true"
       data-i18n-title="term.grip"></div>
  <header class="term-head">
    <span class="term-dot"></span>
    <span id="termScenario" class="term-scenario" data-i18n="term.scenario">沙盒</span>
    <span class="term-spacer"></span>
    <span class="term-sizes" role="group" aria-label="高度档位" data-i18n-aria="term.sizesGroup">
      <button class="term-btn" data-term-size="s" title="小窗" data-i18n-title="term.sizeS">▁</button>
      <button class="term-btn" data-term-size="m" title="中窗" data-i18n-title="term.sizeM">▄</button>
      <button class="term-btn" data-term-size="l" title="大窗" data-i18n-title="term.sizeL">█</button>
    </span>
    <button id="termFontDown" class="term-btn" title="字号变小" data-i18n-title="term.fontDown">A−</button>
    <button id="termFontUp" class="term-btn" title="字号变大" data-i18n-title="term.fontUp">A+</button>
    <button id="termCopy" class="term-btn" title="复制全部输出"
            data-i18n="term.copy" data-i18n-title="term.copyAll">复制</button>
    <button id="termHelp" class="term-btn" title="可用命令" data-i18n-title="term.help">help</button>
    <button id="termReset" class="term-btn" title="重置这个工作区" data-i18n-title="term.reset">⟳</button>
    <button id="termFull" class="term-btn" title="全屏（Ctrl+Shift+F）" aria-label="全屏"
            data-i18n-title="term.fullOn" data-i18n-aria="term.full">⛶</button>
    <button id="termClose" class="term-btn" title="收起" data-i18n-title="term.close">✕</button>
  </header>
  <div id="termOut" class="term-out"></div>
  <div class="term-input-row">
    <span id="termPrompt" class="term-prompt">student@ai-box:~$</span>
    <input id="termInput" class="term-input" spellcheck="false" autocomplete="off"
           autocapitalize="off" autocorrect="off" aria-label="命令输入"
           data-i18n-aria="term.inputAria">
  </div>
</section>

<!-- ============================ 报告弹层 ============================ -->
<div id="reportModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="reportTitle">
  <div class="modal-card">
    <header class="modal-head">
      <h2 id="reportTitle" data-i18n="report.title">结业报告</h2>
      <button id="reportClose" class="icon-btn" aria-label="关闭" data-i18n-aria="report.close">✕</button>
    </header>
    <div id="reportBody" class="modal-body"></div>
    <footer class="modal-foot">
      <input id="reportName" class="text-input" placeholder="你的名字（会写进报告）" maxlength="24"
             data-i18n-placeholder="report.namePlaceholder">
      <button id="reportCopy" class="ghost-btn" data-i18n="report.copy">复制 Markdown</button>
      <button id="reportDownload" class="primary-btn" data-i18n="report.download">下载 .md</button>
    </footer>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- 顺序：工具 → 国际化 → 沙盒内核 → AI 命令包 → 课程数据 → 关卡 → 进度 → 报告 → 终端 → 界面 -->
